name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nanako718/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Get release info
        id: release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/Nanako718/speedtest-ustc/releases/download/${TAG}"

          ARM64_SHA=$(curl -sL "${BASE_URL}/speedtest-ustc-macos-arm64" | sha256sum | awk '{print $1}')
          AMD64_SHA=$(curl -sL "${BASE_URL}/speedtest-ustc-macos-amd64" | sha256sum | awk '{print $1}')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$AMD64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Formula
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          BASE_URL="https://github.com/Nanako718/speedtest-ustc/releases/download/${TAG}"
          ARM64_SHA="${{ steps.release.outputs.arm64_sha }}"
          AMD64_SHA="${{ steps.release.outputs.amd64_sha }}"
          FORMULA="homebrew-tap/Formula/speedtest-ustc.rb"

          cat > "$FORMULA" <<EOF
          class SpeedtestUstc < Formula
            desc "USTC network speed test CLI"
            homepage "https://github.com/Nanako718/speedtest-ustc"
            version "${VERSION}"
            license "MIT"

            on_arm do
              url "${BASE_URL}/speedtest-ustc-macos-arm64"
              sha256 "${ARM64_SHA}"
            end

            on_intel do
              url "${BASE_URL}/speedtest-ustc-macos-amd64"
              sha256 "${AMD64_SHA}"
            end

            def install
              bin.install "speedtest-ustc-macos-arm64" => "speedtest-ustc" if Hardware::CPU.arm?
              bin.install "speedtest-ustc-macos-amd64" => "speedtest-ustc" if Hardware::CPU.intel?
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/speedtest-ustc --version")
            end
          end
          EOF

          # 去掉 heredoc 带来的前导空格（YAML 缩进导致）
          sed -i 's/^          //' "$FORMULA"

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update speedtest-ustc to v${{ steps.release.outputs.version }}"
          git push
