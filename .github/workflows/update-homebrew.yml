name: Update Homebrew Tap

on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]

jobs:
  update-formula:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get tag from release
        id: tag
        run: |
          TAG=$(curl -sH "Authorization: token ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
            "https://api.github.com/repos/Nanako718/speedtest-ustc/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Nanako718/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Get binary SHA256
        id: sha
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BASE_URL="https://github.com/Nanako718/speedtest-ustc/releases/download/${TAG}"
          ARM64_SHA=$(curl -sL "${BASE_URL}/speedtest-ustc-macos-arm64" | sha256sum | awk '{print $1}')
          AMD64_SHA=$(curl -sL "${BASE_URL}/speedtest-ustc-macos-amd64" | sha256sum | awk '{print $1}')
          echo "arm64=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "amd64=$AMD64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Formula
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          BASE_URL="https://github.com/Nanako718/speedtest-ustc/releases/download/${TAG}"
          ARM64_SHA="${{ steps.sha.outputs.arm64 }}"
          AMD64_SHA="${{ steps.sha.outputs.amd64 }}"

          cat > homebrew-tap/Formula/speedtest-ustc.rb <<RUBY
          class SpeedtestUstc < Formula
            desc "USTC network speed test CLI"
            homepage "https://github.com/Nanako718/speedtest-ustc"
            version "${VERSION}"
            license "MIT"

            on_arm do
              url "${BASE_URL}/speedtest-ustc-macos-arm64"
              sha256 "${ARM64_SHA}"
            end

            on_intel do
              url "${BASE_URL}/speedtest-ustc-macos-amd64"
              sha256 "${AMD64_SHA}"
            end

            def install
              bin.install "speedtest-ustc-macos-arm64" => "speedtest-ustc" if Hardware::CPU.arm?
              bin.install "speedtest-ustc-macos-amd64" => "speedtest-ustc" if Hardware::CPU.intel?
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/speedtest-ustc --version")
            end
          end
          RUBY

          sed -i 's/^          //' homebrew-tap/Formula/speedtest-ustc.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update speedtest-ustc to v${{ steps.tag.outputs.version }}"
          git push
