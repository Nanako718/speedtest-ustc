[project]
name = "speedtest-ustc"
version = "1.0.2"
description = "USTC network speedtest CLI tool"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "rich",
    "plotext>=5,<6",
]

[project.scripts]
speedtest-ustc = "speedtest.cli:main"

[tool.setuptools.packages.find]
include = ["speedtest*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
